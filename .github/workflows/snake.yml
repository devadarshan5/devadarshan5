name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you also run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVG
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pirate-snake.svg
            dist/pirate-snake-dark.svg?palette=github-dark

      - name: Generate the activity graph SVG
        uses: ashutosh00710/github-readme-activity-graph@v2.0.0
        with:
          username: ${{ github.repository_owner }}
          theme: react-dark
          bg_color: "0b1120"
          color: "f2c14e"
          line: "c0392b"
          point: "e8dcc8"
          hide_border: true
          area: true
          output: dist/pirate-activity-graph.svg

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
